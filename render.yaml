services:
  - type: web
    name: quenoxa-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
